services:
  - type: web
    name: evolution-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SERVER_TYPE
        value: http
      - key: SERVER_PORT
        value: "8080"
      - key: AUTHENTICATION_API_KEY
        value: cmor_evolution_secret_key
      - key: DATABASE_ENABLED
        value: "false"
      - key: MANAGER_API_ENABLED
        value: "false"
      - key: CONFIG_SESSION_PHONE_CLIENT
        value: CMOR Agent
      - key: CONFIG_SESSION_PHONE_NAME
        value: Chrome
